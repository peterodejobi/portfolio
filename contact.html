    <main>
        <div class="page-top">
            <p class="lab reveal">( Reach out )</p>
            <h1 class="mg"><span class="mask"><span>Contact me</span></span></h1>
        </div>
        <div class="wrap">
            <section style="padding-top:2rem">
                <form id="contactForm" novalidate>
                    <label for="name">Name<input id="name" type="text" autocomplete="name"><span class="err"
                            id="nameErr"></span></label>
                    <label for="email">Email address<input id="email" type="email" autocomplete="email"><span
                            class="err" id="emailErr"></span></label>
                    <label for="phone">Phone number<input id="phone" type="tel" autocomplete="tel"><span class="err"
                            id="phoneErr"></span></label>
                    <label for="message">Message<textarea id="message" rows="5"></textarea><span class="err"
                            id="messageErr"></span></label>
                    <button class="btn" type="submit" data-cursor="hover">Send message</button>
                    <div id="result" aria-live="polite"></div>
                </form>
            </section>
        </div>
    </main>
    <footer class="call">
        <div class="pelmet" aria-hidden="true"></div>
